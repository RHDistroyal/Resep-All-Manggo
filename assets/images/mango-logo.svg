<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Circle/Squircle Soft Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="100%" stop-color="#FFF0D4"/>
    </linearGradient>

    <!-- Luscious Ripe Mango Gradient (Sun-Kissed Golden Orange to Rich Coral Blush) -->
    <linearGradient id="mangoBodyGrad" x1="25%" y1="15%" x2="75%" y2="85%">
      <stop offset="0%" stop-color="#FFE082"/>    <!-- Golden Yellow Tip -->
      <stop offset="28%" stop-color="#FFB300"/>   <!-- Warm Mango Yellow -->
      <stop offset="65%" stop-color="#FB8C00"/>   <!-- Deep Succulent Orange -->
      <stop offset="100%" stop-color="#E64A19"/>  <!-- Rich Tropical Blush -->
    </linearGradient>

    <!-- Glossy Highlight for 3D Juicy Volume -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="60%" y2="80%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Stem Gradient -->
    <linearGradient id="stemGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4E342E"/>
      <stop offset="100%" stop-color="#795548"/>
    </linearGradient>

    <!-- Soft Ambient Drop Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#C2410C" flood-opacity="0.22"/>
    </filter>

    <filter id="leafShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="6" stdDeviation="6" flood-color="#064E3B" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Modern App Icon Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#FFE3A8" stroke-width="3"/>

  <!-- Subtle Ambient Glow beneath Fruit -->
  <ellipse cx="256" cy="425" rx="140" ry="24" fill="#E2841E" opacity="0.22" filter="blur(14px)"/>

  <!-- MAIN MANGO FRUIT (Authentic Plump Tropical Kidney Shape) -->
  <g filter="url(#softShadow)">
    <path d="M 270 120
             C 340 135, 415 195, 415 285
             C 415 375, 335 440, 240 440
             C 165 440, 115 385, 120 310
             C 125 240, 160 170, 215 130
             C 235 115, 255 116, 270 120 Z"
          fill="url(#mangoBodyGrad)"/>
  </g>

  <!-- Luscious Juicy Gloss Overlay -->
  <path d="M 260 140
           C 320 155, 380 205, 385 275
           C 388 320, 360 365, 330 380
           C 315 350, 310 260, 235 200
           C 205 175, 225 150, 260 140 Z"
        fill="url(#glossGrad)"/>

  <!-- Accent Cheek Specular Dot -->
  <ellipse cx="340" cy="225" rx="20" ry="34" transform="rotate(-25 340 225)" fill="#FFFFFF" opacity="0.45"/>

  <!-- NATURAL FRESH LEAF WITH STEM -->
  <!-- Stem -->
  <path d="M 252 135 C 248 100, 238 78, 225 65 C 229 64, 235 64, 240 68 C 252 82, 262 105, 264 135 Z"
        fill="url(#stemGrad)"/>

  <!-- Green Mango Leaf -->
  <g filter="url(#leafShadow)">
    <path d="M 245 100
             C 210 70, 150 75, 105 115
             C 145 155, 205 145, 245 100 Z"
          fill="url(#leafGrad)"/>
    <!-- Leaf Center Vein -->
    <path d="M 245 100 C 195 102, 145 108, 105 115"
          fill="none" stroke="#D1FAE5" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
    <path d="M 195 102 C 185 92, 172 88, 165 86" fill="none" stroke="#D1FAE5" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <path d="M 170 105 C 160 115, 148 122, 138 125" fill="none" stroke="#D1FAE5" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Small Dewdrop on Mango (Extra Fresh Detail) -->
  <circle cx="295" cy="315" r="9" fill="#FFFFFF" opacity="0.75"/>
  <circle cx="293" cy="313" r="3.5" fill="#FFFFFF"/>
</svg>
